<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mypet-world | Pet Owner Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/first.png">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>  
    <script src="counter.js"></script>

    <style>
        /* 🔵 Cyber Blue Background Canvas Fixed Overrides */
        #networkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Placed cleanly behind all template glass components */
            pointer-events: none;
            background: #020617; /* High contrast ultra-dark backdrop */
        }

        /* Essential overlay pointer logic rule */
        .content-container {
            position: relative;
            z-index: 10;
        }
    </style>

    <script>
        async function includeHTML(placeholderId, filename) {
            try {
                const response = await fetch(filename);
                if (response.ok) {
                    document.getElementById(placeholderId).innerHTML = await response.text();
                } else {
                    console.error(`Failed to load ${filename}: ${response.statusText}`);
                }
            } catch (error) {
                console.error(`Error fetching ${filename}:`, error);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([
                includeHTML('header-placeholder', 'header.html'),
                includeHTML('services-grid-placeholder', 'services.html'),
                includeHTML('services2-grid-placeholder', 'services2.html'),
                includeHTML('third-column-placeholder', 'thirdColumn.html'),
                includeHTML('footer-placeholder', 'footer.html')
            ]);
            loadCounter();
            window.dispatchEvent(new Event('ComponentsLoaded'));
            initBackgroundCyberNetwork(); // Triggers the cyber blue webbing
        });
    </script>
</head>
<body>

    <canvas id="networkCanvas"></canvas>

    <div id="header-placeholder"></div>
    
    <div class="content-container" style="max-width: 1200px; margin: 0 auto; padding: clamp(12px, 3vw, 24px); box-sizing: border-box; width: 100%;">
        <main style="width: 100%; box-sizing: border-box;">            
            <div class="glass-card" style="margin-bottom: 32px; text-align: left; background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 24px; padding: clamp(20px, 4vw, 40px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25); box-sizing: border-box; width: 100%; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
                <h2 style="margin-top:0; font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 800; color: #ffffff; letter-spacing: -0.5px; word-break: break-word;">Welcome <span id="dash-username" style="color: #4ade80; text-transform: capitalize;"></span>! 🐾</h2>
                <p style="font-size: 1rem; color: #cbd5e1; margin: 8px 0;"><strong>Account Type:</strong> <span id="dash-role" style="color: #4ade80; font-weight: 600;">Pet Owner</span></p>

                        Add Companion Animal

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 20px; flex-wrap: wrap; gap: 12px;">
                    <h1 style="font-size: 1.4rem; font-weight: 700; color: #ffffff; margin: 0;">Dashboard</h1>
                    <button id="dash-logout-btn" class="btn-danger" style="display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; font-family: 'Lexend', sans-serif; cursor: pointer; transition: all 0.2s ease;">
                        SIGN OUT
                    </button>

            <div id="live-registered-pets-feed" style="width: 100%; box-sizing: border-box;"></div>

            <div id="services2-grid-placeholder"></div>

        </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwbT7Tb1uh7XySfPjqvpit-A-OpuZ9wrw",
            authDomain: "mypet-worlds.firebaseapp.com",
            projectId: "mypet-worlds",
            storageBucket: "mypet-worlds.firebasestorage.app",
            messagingSenderId: "223873016606",
            appId: "1:223873016606:web:b228b11e349e9ee85c9f0f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUserId = null;
        let activePetsListener = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                if (activePetsListener) activePetsListener();
                window.location.href = "account.html";
                return;
            }
            currentUserId = user.uid;

            try {
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    if (document.getElementById('dash-username')) document.getElementById('dash-username').innerText = userData.username || "Pet Owner";
                    if (document.getElementById('dash-email')) document.getElementById('dash-email').innerText = userData.email || user.email;
                    if (document.getElementById('dash-role')) document.getElementById('dash-role').innerText = (userData.profileType || "PET_OWNER").replace('_', ' ').toUpperCase();
                }

                startLivePetsListener();

            } catch (error) { console.error("Error initializing dashboard metadata maps:", error); }
        });

        function startLivePetsListener() {
            if (!currentUserId) return;

            const feedContainer = document.getElementById('live-registered-pets-feed');

            activePetsListener = db.collection("users").doc(currentUserId).collection("pets")
                .orderBy("updatedAt", "desc")
                .onSnapshot(async (snapshot) => {
                    
                    feedContainer.innerHTML = "";

                    if (snapshot.empty) {
                        feedContainer.innerHTML = `
                            <div style="text-align: center; color: #94a3b8; padding: 40px 20px; border: 1px dashed rgba(255,255,255,0.06); border-radius:24px; background: rgba(15, 23, 42, 0.2); font-family: 'Lexend', sans-serif; box-sizing: border-box; width:100%;">
                                🐾 No registered companion animal files located under this profile matrix yet. Click "Add Pet" above to establish a new record file.
                            </div>
                        `;
                        return;
                    }

                    const response = await fetch('petowner/registered-pet.html');
                    if (!response.ok) return;
                    const cardTemplateHTML = await response.text();

                    snapshot.forEach((doc) => {
                        const petData = doc.data();
                        const petId = doc.id;

                        const cardWrapper = document.createElement('div');
                        cardWrapper.style.width = "100%";
                        cardWrapper.style.boxSizing = "border-box";
                        cardWrapper.innerHTML = cardTemplateHTML;
                        const cardElement = cardWrapper.firstElementChild;

                        cardElement.setAttribute('data-id', petId);

                        // 🎨 DYNAMIC SPECIES THEME ENGINE
                        const species = (petData.species || "cat").toLowerCase();
                        const badgeElement = cardElement.querySelector('.digital-license-badge');
                        
                        if (badgeElement) {
                            if (species.includes('dog')) {
                                badgeElement.style.borderColor = "#38bdf8"; // 🚙 Cyber Light Blue (Canine)
                            } else if (species.includes('rabbit')) {
                                badgeElement.style.borderColor = "#c084fc"; // 🔮 Orchid Purple (Exotic)
                            } else if (species.includes('bird')) {
                                badgeElement.style.borderColor = "#f59e0b"; // 🍊 Vibrant Amber (Avian)
                            } else {
                                badgeElement.style.borderColor = "#4ade80"; // 🟢 Emerald Mint (Feline / Default)
                            }
                        }
                        
                        cardElement.querySelector('.view-petAvatar').src = petData.petAvatarData || "./assets/first.png";
                        cardElement.querySelector('.view-petName').innerText = petData.petName || "Unnamed";
                        cardElement.querySelector('.view-petGender').innerText = petData.gender || "Unknown";
                        cardElement.querySelector('.view-petSpecies').innerText = petData.species || "Unknown";
                        cardElement.querySelector('.view-petSubspecies').innerText = petData.subspecies || "Unknown";
                        cardElement.querySelector('.view-petAge').innerText = petData.age || "N/A";       
                        cardElement.querySelector('.view-petUniqueId').innerText = petData.uniqueID || "------";
                        cardElement.querySelector('.view-healthLog1').innerText = petData.healthLogs ? (petData.healthLogs[0] || "-") : "-";
                        cardElement.querySelector('.view-healthLog2').innerText = petData.healthLogs ? (petData.healthLogs[1] || "-") : "-";
                        cardElement.querySelector('.view-healthLog3').innerText = petData.healthLogs ? (petData.healthLogs[2] || "-") : "-";
                        cardElement.querySelector('.view-healthLog4').innerText = petData.healthLogs ? (petData.healthLogs[3] || "-") : "-";
                        cardElement.querySelector('.view-healthLog5').innerText = petData.healthLogs ? (petData.healthLogs[4] || "-") : "-";
                        cardElement.querySelector('.view-healthLog6').innerText = petData.healthLogs ? (petData.healthLogs[5] || "-") : "-";

                        const vaccineContainer = cardElement.querySelector('.view-vaccine-list');
                        vaccineContainer.innerHTML = ""; 

                        const historyArray = petData.vaccinations || [];
                        let prioritizedExpiry = "No Booster Scheduled";

                        if (historyArray.length === 0) {
                            vaccineContainer.innerHTML = `<span style="color: #64748b; font-size: 0.9rem; font-style: italic;">No verified medical vaccine records tracked.</span>`;
                        } else {
                            const sortedVaccines = [...historyArray].sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
                            prioritizedExpiry = sortedVaccines[0].expiry;

                            historyArray.forEach((vac) => {
                                const row = document.createElement('div');
                                row.style.cssText = "background: rgba(2, 6, 23, 0.3); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); font-family: 'Lexend', sans-serif; box-sizing: border-box; width: 100%; margin-bottom: 8px;";
                                row.innerHTML = `
                                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                                        <span style="font-weight: 800; color: #fff; font-size: 0.95rem;">🛡️ ${vac.type}</span>
                                        <span style="color: #94a3b8; font-size: 0.8rem;">Administered: <strong>${vac.date}</strong></span>
                                    </div>
                                    <div style="margin-top: 6px; font-size: 0.85rem; color: #cbd5e1; line-height: 1.5; background: rgba(0,0,0,0.15); padding: 8px 12px; border-radius: 6px; word-break: break-word;">
                                        <strong>Label/Components:</strong> ${vac.label || 'N/A'}<br>
                                        <strong>Serial/Batch:</strong> <span style="font-family: monospace; color: var(--leaf-green); font-weight:700;">${vac.serialNumber || 'N/A'}</span><br>
                                        <strong>Veterinarian:</strong> ${vac.vetName || 'N/A'} <span style="color: #64748b; font-size:0.75rem;">(MVC: ${vac.mvcNo || 'N/A'})</span>
                                    </div>
                                    <div style="margin-top: 6px; text-align: right; font-size: 0.8rem; color: #f87171; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
                                        ⏳ Expires: ${vac.expiry}
                                    </div>
                                `;
                                vaccineContainer.appendChild(row);
                            });
                        }

                        cardElement.querySelector('.view-passportMasterExpiry').innerText = prioritizedExpiry;
                        feedContainer.appendChild(cardElement);
                    });
                }, (error) => {
                    console.error("Realtime companion tracking stream broken:", error);
                });
        }

        async function injectNewPetForm() {
            try {
                const response = await fetch('petowner/pet-profile.html');
                if (!response.ok) return;
                const formHTML = await response.text();

                const container = document.getElementById('dynamic-pet-forms-container');
                const tempWrapper = document.createElement('div');
                tempWrapper.innerHTML = formHTML;
                const freshFormElement = tempWrapper.firstElementChild;

                const customRefId = db.collection("users").doc(currentUserId).collection("pets").doc().id;
                const polishedShortId = customRefId.substring(0, 6).toUpperCase();
                freshFormElement.querySelector('.petUniqueId').value = polishedShortId;

                freshFormElement.querySelector('.dynamic-pet-submit-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if(!currentUserId) return;

                    const vType = freshFormElement.querySelector('.vaccineType').value;
                    const vLabel = freshFormElement.querySelector('.vaccineLabel').value;
                    const vSerial = freshFormElement.querySelector('.vaccineSerial').value;
                    const vVet = freshFormElement.querySelector('.vaccineVet').value;
                    const vMvc = freshFormElement.querySelector('.vaccineMvc').value;
                    const vDate = freshFormElement.querySelector('.vaccineDate').value;
                    const vExpiry = freshFormElement.querySelector('.vaccineExpiry').value;

                    let initialVaccines = [];
                    if (vType && vDate) {
                        initialVaccines.push({
                            type: vType,
                            label: vLabel || "N/A",
                            serialNumber: vSerial || "N/A",
                            vetName: vVet || "N/A",
                            mvcNo: vMvc || "N/A",
                            date: vDate,
                            expiry: vExpiry
                        });
                    }

                    const petRecord = {
                        petName: freshFormElement.querySelector('.petName').value,
                        species: freshFormElement.querySelector('.petSpecies').value,
                        subspecies: freshFormElement.querySelector('.petSubspecies').value,
                        age: freshFormElement.querySelector('.petAge').value || "N/A",
                        gender: freshFormElement.querySelector('.petGender').value,
                        uniqueID: polishedShortId,
                        vaccinations: initialVaccines,
                        healthLogs: ["-", "-", "-", "-", "-", "-"],
                        petAvatarData: "",
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    try {
                        await db.collection("users").doc(currentUserId).collection("pets").add(petRecord);
                        freshFormElement.remove(); 
                    } catch(err) {
                        console.error("Profile submit transaction crash:", err);
                        alert("Database server transaction failed.");
                    }
                });

                container.insertBefore(freshFormElement, container.firstChild);
            } catch (error) { console.error(error); }
        }

        async function submitInlineBooster(btn) {
            const card = btn.closest('.registered-pet-card');
            const petId = card.getAttribute('data-id');
            if (!currentUserId || !petId) return;

            const typeInput = card.querySelector('.newVaccineType');
            const dateInput = card.querySelector('.newVaccineDate');
            const labelInput = card.querySelector('.newVaccineLabel');
            const serialInput = card.querySelector('.newVaccineSerial');
            const vetInput = card.querySelector('.newVaccineVet');
            const mvcInput = card.querySelector('.newVaccineMvc');

            const type = typeInput.value.trim();
            const date = dateInput.value;

            if (!type || !date) {
                alert("Please fill in both the vaccine name and administration date.");
                return;
            }

            const speciesText = card.querySelector('.view-petSpecies').innerText.toLowerCase();
            const adminDate = new Date(date);
            const gapYears = speciesText.includes('rabbit') ? 1 : 3;
            adminDate.setFullYear(adminDate.getFullYear() + gapYears);
            const expiry = adminDate.toISOString().split('T')[0];

            const newVaccineObj = { 
                type, 
                label: labelInput ? labelInput.value.trim() || "N/A" : "N/A",
                serialNumber: serialInput ? serialInput.value.trim() || "N/A" : "N/A",
                vetName: vetInput ? vetInput.value.trim() || "N/A" : "N/A",
                mvcNo: mvcInput ? mvcInput.value.trim() || "N/A" : "N/A",
                date, 
                expiry 
            };

            try {
                const petRef = db.collection("users").doc(currentUserId).collection("pets").doc(petId);
                await petRef.update({
                    vaccinations: firebase.firestore.FieldValue.arrayUnion(newVaccineObj),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                typeInput.value = ""; dateInput.value = "";
                if(labelInput) labelInput.value = "";
                if(serialInput) serialInput.value = "";
                if(vetInput) vetInput.value = "";
                if(mvcInput) mvcInput.value = "";
                
                card.querySelector('.booster-form-slot').style.display = 'none';
                alert("Vaccination passport log successfully updated!");
            } catch (error) {
                console.error("Error appending booster shot document log:", error);
                alert("Failed to record vaccination entry.");
            }
        }

        const scheduleSpecs = {
            dog: "Core Rabies, DHPP (Distemper, Hepatitis, Parvovirus, Parainfluenza). Booster every 3 Years.",
            cat: "Core FVRCP (Feline Viral Rhinotracheitis, Calicivirus, Panleukopenia) + Rabies. Booster every 3 Years.",
            rabbit: "Myxomatosis and Rabbit Haemorrhagic Disease (RHDV-1 & RHDV-2). Booster annually.",
            bird: "Polyomavirus & Psittacosis screen tracks. Consult avian practitioner."
        };

        function handleSpeciesChange(selectEl) {
            const formInstance = selectEl.closest('.pet-profile-form-instance');
            const banner = formInstance.querySelector('.vaccineInfoBanner');
            const txt = formInstance.querySelector('.vaccineRecommendationText');
            if(scheduleSpecs[selectEl.value]) {
                txt.innerText = scheduleSpecs[selectEl.value];
                banner.style.display = "block";
                handleDateChange(formInstance.querySelector('.vaccineDate'));
            }
        }

        function handleDateChange(dateInputEl) {
            if(!dateInputEl.value) return;
            const formInstance = dateInputEl.closest('.pet-profile-form-instance');
            const species = formInstance.querySelector('.petSpecies').value;
            const expiryInput = formInstance.querySelector('.vaccineExpiry');

            const adminDate = new Date(dateInputEl.value);
            const gapYears = (species === 'rabbit') ? 1 : 3;
            adminDate.setFullYear(adminDate.getFullYear() + gapYears);
            expiryInput.value = adminDate.toISOString().split('T')[0];
        }

        function toggleBoosterForm(btn) {
            const card = btn.closest('.registered-pet-card');
            const formSlot = card.querySelector('.booster-form-slot');
            formSlot.style.display = (formSlot.style.display === 'none' || formSlot.style.display === '') ? 'block' : 'none';
        }

        function toggleHealthForm(headerEl) {
            const card = headerEl.closest('.registered-pet-card');
            const formSlot = card.querySelector('.health-logs-form-slot');
            const arrow = card.querySelector('.view-health-arrow');
            if (formSlot.style.display === 'none' || formSlot.style.display === '') {
                formSlot.style.display = 'grid';
                arrow.style.transform = 'rotate(180deg)';
            } else {
                formSlot.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';

        // 📸 Trigger the hidden file input when clicking the avatar frame
        function triggerAvatarUpload(element) {
            const fileInput = element.querySelector('.avatar-file-input');
            if (fileInput) fileInput.click();
        }
        
        // 🗜️ Core Processing: Compresses images locally before hitting the server
        function handleAvatarFileChange(inputEl) {
            const file = inputEl.files[0];
            if (!file) return;
        
            const card = inputEl.closest('.registered-pet-card');
            const petId = card.getAttribute('data-id');
            const avatarImg = card.querySelector('.view-petAvatar');
        
            if (!currentUserId || !petId) return;
        
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = async function () {
                    // Target avatar profile box boundaries exactly
                    const targetWidth = 256;
                    const targetHeight = 256;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext('2d');
        
                    // Draw and square crop the image centered automatically
                    let minEdge = Math.min(img.width, img.height);
                    let sx = (img.width - minEdge) / 2;
                    let sy = (img.height - minEdge) / 2;
                    ctx.drawImage(img, sx, sy, minEdge, minEdge, 0, 0, targetWidth, targetHeight);
        
                    // Compress to JPEG format at medium-high quality settings (70%)
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
        
                    // Immediately set the front-end layout preview for visual speed
                    avatarImg.src = compressedDataUrl;
        
                    try {
                        // 📂 OPTION A: Write directly to Firestore as a data string string box if under 50KB
                        // This completely bypasses Firebase Storage, keeping your storage costs flat at $0!
                        await db.collection("users").doc(currentUserId).collection("pets").doc(petId).update({
                            petAvatarData: compressedDataUrl,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        console.log("Compressed avatar mapped smoothly to Firestore records matrix.");
                    } catch (err) {
                        console.error("Failed to commit profile image upload metadata maps:", err);
                        alert("Cloud sync connection timed out.");
                    }
                };
            };
        }
        
        async function saveCardEdits(btn) {
            const card = btn.closest('.registered-pet-card');
            const petId = card.getAttribute('data-id');
            if (!currentUserId || !petId) return;

            const updatedName = card.querySelector('.view-petName').innerText.trim();
            const log1 = card.querySelector('.view-healthLog1').innerText.trim();
            const log2 = card.querySelector('.view-healthLog2').innerText.trim();
            const log3 = card.querySelector('.view-healthLog3').innerText.trim();
            const log4 = card.querySelector('.view-healthLog4').innerText.trim();
            const log5 = card.querySelector('.view-healthLog5').innerText.trim();
            const log6 = card.querySelector('.view-healthLog6').innerText.trim();

            if (!updatedName) {
                alert("Companion's name cannot be left empty.");
                return;
            }

            try {
                await db.collection("users").doc(currentUserId).collection("pets").doc(petId).update({
                    petName: updatedName,
                    healthLogs: [log1, log2, log3, log4, log5, log6],
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`Secure registry records updated successfully!`);
            } catch (error) {
                console.error(error);
                alert("Failed to synchronize updates with the cloud.");
            }
        }

        async function deletePetProfile(btn) {
            const card = btn.closest('.registered-pet-card');
            const petId = card.getAttribute('data-id');
            const petName = card.querySelector('.view-petName').innerText;
            if (!currentUserId || !petId) return;

            const securityCheck = confirm(`Are you absolutely sure you want to remove ${petName}'s profile file permanently?`);
            if (!securityCheck) return;

            try {
                await db.collection("users").doc(currentUserId).collection("pets").doc(petId).delete();
                alert("Profile file deleted safely.");
            } catch (error) { alert("Failed to delete record."); }
        }

        document.getElementById('dash-logout-btn').addEventListener('click', async () => {
            try { await auth.signOut(); } catch (error) { console.error(error); }
        });
      
        // 🔮 UPGRADED: Cyber Blue Interactive Network Constellation Simulation
        let mouse = { x: null, y: null };
        function initBackgroundCyberNetwork() {
            const canvas = document.getElementById('networkCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let particles = [];
            const particleCount = 60; 
            const connectionDist = 180; // Extended reach webbing

            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            window.addEventListener('mouseout', () => {
                mouse.x = null;
                mouse.y = null;
            });

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                init();
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.baseSize = Math.random() * 3 + 3; // Enhanced node radius (3px - 6px)
                    this.size = this.baseSize;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.speedY = (Math.random() - 0.5) * 0.5;
                    this.pulse = Math.random() * Math.PI;
                    this.pulseSpeed = Math.random() * 0.05 + 0.02;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.vy || this.speedY; // Fallback structure safety

                    this.pulse += this.pulseSpeed;
                    this.size = this.baseSize + Math.sin(this.pulse) * 2;

                    if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                    if (this.y > canvas.height || this.y < 0) this.speedY *= -1;

                    // Proximity mouse push logic
                    if (mouse.x !== null && mouse.y !== null) {
                        let dx = mouse.x - this.x;
                        let dy = mouse.y - this.y;
                        let distance = Math.sqrt(dx*dx + dy*dy);
                        if (distance < 150) {
                            this.x -= dx / 40;
                            this.y -= dy / 40;
                        }
                    }
                }
                draw() {
                    ctx.fillStyle = 'rgba(0, 159, 252, 0.8)';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#009FFC';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0; // Performance optimization reset
                }
            }

            function init() {
                particles = [];
                for (let i = 0; i < particleCount; i++) particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < connectionDist) {
                            ctx.strokeStyle = `rgba(0, 159, 252, ${1.2 - distance / connectionDist})`;
                            ctx.lineWidth = 1.2; 
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            animate();
        }
    </script>
    <div id="footer-placeholder"></div>
</body>
</html>
