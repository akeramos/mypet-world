<style>
    /* Third Column Dashboard Section Grid Layout Configuration */
    .metric-showcase-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: clamp(16px, 4vw, 40px); /* 🚀 RESPONSIVE: Dynamic card padding */
        margin-bottom: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        gap: clamp(20px, 4vw, 40px); /* 🚀 RESPONSIVE: Dynamic item gaps */
        font-family: 'Lexend', sans-serif;
        box-sizing: border-box;
        width: 100%;
    }
    .metric-info-side { max-width: 60%; }
    .metric-info-side h3 { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 800; color: #ffffff; margin: 0 0 16px 0; letter-spacing: -0.5px; }
    .metric-info-side p { font-size: clamp(0.95rem, 2vw, 1.1rem); color: #94a3b8; line-height: 1.7; margin: 0; }
    .metric-info-side .highlight-compliance { color: #4ade80; font-weight: 600; }
    
    /* 🚀 FIXED: Allow container box to wrap cleanly if numbers grow */
    .counter-meter-box { 
        display: flex; 
        flex-direction: column; 
        align-items: flex-end; 
        justify-content: center; 
        max-width: 100%;
        box-sizing: border-box;
    }
    
    /* 🟢 Blinking Green Live Indicator Layout */
    .counter-label { 
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        font-weight: 700;
        color: #4ade80;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 12px;
        text-shadow: 0 0 10px rgba(74, 222, 128, 0.3); 
    }
    .live-pulse-dot {
        width: 8px;
        height: 8px;
        background-color: #4ade80;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
        animation: pulseIndicatorLoop 2s infinite;
    }
    @keyframes pulseIndicatorLoop {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    /* 📈 Dynamic Scroll Up Digit Structures */
    .digital-ticker { 
        background: #020617; 
        border: 1px solid rgba(74, 222, 128, 0.2); 
        border-radius: 16px; 
        padding: clamp(10px, 2vw, 16px) clamp(14px, 3vw, 24px); /* 🚀 RESPONSIVE inner ticker cushion */
        display: flex; 
        gap: clamp(3px, 1vw, 6px); /* 🚀 RESPONSIVE tight gaps for digits */
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(74, 222, 128, 0.05); 
        align-items: center;
        max-width: 100%;
        box-sizing: border-box;
    }
    .ticker-digit { 
        font-family: monospace; 
        font-size: clamp(2rem, 8vw, 3.5rem); /* 🚀 MAGIC: Scales beautifully from desktop down to tiny mobile sizes */
        font-weight: 800; 
        color: #ffffff; 
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); 
        padding: 4px clamp(6px, 1.5vw, 10px); 
        border-radius: 8px; 
        border: 1px solid rgba(255, 255, 255, 0.05); 
        min-width: clamp(24px, 7vw, 38px); 
        text-align: center; 
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        overflow: hidden;
        height: clamp(2.8rem, 10vw, 4.5rem); /* 🚀 FLUID HEIGHT to keep up with dynamic fonts */
        line-height: clamp(2.8rem, 10vw, 4.5rem); /* 🚀 FIXED LINE-HEIGHT tracking alignment */
        display: inline-block;
        box-sizing: border-box;
    }
    
    .ticker-digit span {
        display: block;
        animation: scrollDigitUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes scrollDigitUp {
        from { transform: translateY(100%); opacity: 0; } /* 🚀 FIXED: Dynamic percentage avoids overflow breaks */
        to { transform: translateY(0); opacity: 1; }
    }
    
    .ticker-comma { 
        font-family: monospace; 
        font-size: clamp(1.5rem, 6vw, 2.5rem); /* 🚀 RESPONSIVE comma scaling */
        font-weight: 800; 
        color: rgba(74, 222, 128, 0.5); 
        align-self: flex-end; 
        padding-bottom: clamp(2px, 1vw, 4px); 
    }
    
    @media (max-width: 992px) {
        .metric-showcase-container { flex-direction: column; align-items: flex-start; gap: 24px; }
        .metric-info-side { max-width: 100%; }
        .counter-meter-box { align-items: flex-start; min-width: 100%; }
    }
</style>

<div class="metric-showcase-container">
    <div class="metric-info-side">
        <h3>Our Trusted Ecosystem is Moving Forward!</h3>
        <p>Join our robust Mypet-world community! We explicitly customized our care to serve pets better! 
          Our footprint reaches 50,000+ active users within Southeast Asia across  
          <span class="highlight-compliance">Malaysia, Thailand, Vietnam and Indonesia!</span>
        </p>
    </div>

    <div class="counter-meter-box">
        <div class="counter-label">
            <span class="live-pulse-dot"></span>
            Global Active Footprint
        </div>
        <div class="digital-ticker" id="liveEcosystemTicker">
            <span class="ticker-digit"><span>7</span></span>
            <span class="ticker-digit"><span>0</span></span>
            <span class="ticker-comma">,</span>
            <span class="ticker-digit"><span>1</span></span>
            <span class="ticker-digit"><span>4</span></span>
            <span class="ticker-digit"><span>2</span></span>
        </div>
    </div>
</div>
